name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck contracts
        run: pnpm --filter @roots/contracts typecheck

      - name: Typecheck DB
        run: pnpm --filter @roots/db typecheck

      - name: Typecheck API
        run: pnpm --filter @roots/api typecheck

      - name: Typecheck Web
        run: pnpm --filter @roots/web typecheck

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @roots/api build

      - name: Build Web
        run: pnpm --filter @roots/web build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @roots/web lint

  db-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migrations are up-to-date
        run: |
          cd packages/db
          DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/roots" pnpm db:generate
          git diff --exit-code drizzle/ || (echo "Migrations are out of date. Run 'pnpm db:generate' and commit." && exit 1)

  docker:
    runs-on: ubuntu-latest
    needs: [typecheck, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t roots-api .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t roots-web .
